name: Daily Signal Pipeline

# Two triggers can start this workflow: GitHub's own schedule below, and an
# external scheduler via workflow_dispatch. A run takes ~30 min, so they can
# overlap.
# Queue them instead - the pipeline is safe run back-to-back, not concurrently.
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

on:
  schedule:
    # 08:02 UTC = 15:02 Vietnam time (UTC+7), weekdays only.
    # NOTE: this has never actually fired - 0 schedule events across 16+
    # weekdays (2026-08-21), with Actions enabled, the workflow active, a valid
    # cron and the file on the default branch. An external scheduler drives the
    # real trigger through workflow_dispatch instead. This block is kept only so
    # we notice if GitHub ever starts honouring it; the concurrency group above
    # bounds the cost if it does. Do not treat it as a fallback.
    - cron: '2 8 * * 1-5'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true  # Pull Git LFS files (breakout_model.pkl)

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: daily_suggestion_system/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r daily_suggestion_system/requirements.txt

      - name: Run daily pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: daily_suggestion_system/src/daily_pipeline
        run: |
          python run_daily_pipeline.py
